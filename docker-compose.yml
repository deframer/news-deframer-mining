services:
  miner:
    build:
      context: .
      dockerfile: build/package/mining/Dockerfile
    image: ghcr.io/deframer/news-deframer-mining/miner:latest
    environment:
      - DSN=${DSN:-host=postgres user=deframer password=deframer dbname=deframer port=5432 sslmode=disable}
      - LOG_DATABASE=${LOG_DATABASE:-false}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      # we download the models on demand
      - SPACY_MODELS=${SPACY_MODELS:-en de dk}
      - MEMOLON_MODELS=${MEMOLON_MODELS:-en de dk}
    networks:
      - infra-net

networks:
  infra-net:
    name: deframer-infra-env-net
    external: true
